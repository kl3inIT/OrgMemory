name: Build production images

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: production-images-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  images:
    name: Image · ${{ matrix.name }}
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            file: infrastructure/images/spring-boot-app.Dockerfile
            build-args: |
              APP_NAME=api
          - name: worker
            file: infrastructure/images/spring-boot-app.Dockerfile
            build-args: |
              APP_NAME=worker
          - name: mcp
            file: infrastructure/images/spring-boot-app.Dockerfile
            build-args: |
              APP_NAME=mcp
          - name: web
            file: web/Dockerfile
            build-args: ""
          - name: keycloak
            file: infrastructure/keycloak/Dockerfile
            build-args: ""
          - name: postgres-rag
            file: infrastructure/postgres-rag/Dockerfile
            build-args: ""
    steps:
      - name: Check out verified source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ghcr.io/kl3init/orgmemory-${{ matrix.name }}:sha-${{ github.event.workflow_run.head_sha }}
          build-args: |
            VCS_REF=${{ github.event.workflow_run.head_sha }}
            BUILD_DATE=${{ github.event.workflow_run.updated_at }}
            ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: mode=max
          sbom: true

      - name: Scan published image
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ghcr.io/kl3init/orgmemory-${{ matrix.name }}:sha-${{ github.event.workflow_run.head_sha }}
          format: table
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "1"
