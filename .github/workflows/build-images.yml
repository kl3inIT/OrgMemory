name: Build production images

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: read

concurrency:
  group: production-images-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan affected images
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base_sha: ${{ steps.plan.outputs.base_sha }}
      base_images: ${{ steps.base.outputs.base_images }}
      changed: ${{ steps.plan.outputs.changed }}
      unchanged: ${{ steps.plan.outputs.unchanged }}
    steps:
      - name: Check out verified source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Find previous successful image set
        id: base
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          base_sha=""
          base_images='{}'
          candidates="$(
            gh run list \
              --workflow "Build production images" \
              --branch main \
              --status success \
              --limit 50 \
              --json conclusion,databaseId,headSha \
              --jq ".[] |
                select(.conclusion == \"success\" and .headSha != \"$HEAD_SHA\") |
                [.databaseId, .headSha] |
                @tsv"
          )"
          while IFS=$'\t' read -r run_id candidate; do
            [[ "$candidate" =~ ^[0-9a-f]{40}$ ]] || continue
            if git cat-file -e "$candidate^{commit}" 2>/dev/null &&
              git merge-base --is-ancestor "$candidate" "$HEAD_SHA"; then
              release_jobs="$(
                gh run view "$run_id" \
                  --json jobs \
                  --jq '[.jobs[] |
                    select(
                      .name == "Verify immutable image set" and
                      .conclusion == "success"
                    )
                  ] | length'
              )"
              if [[ "$release_jobs" -gt 0 ]]; then
                artifact_dir="$(mktemp -d)"
                if gh run download "$run_id" \
                  --name "production-image-set-${candidate}" \
                  --dir "$artifact_dir" >/dev/null 2>&1 &&
                  jq -e --arg candidate "$candidate" '
                    .commitSha == $candidate and
                    (.images | length) == 6 and
                    ([.images[].component] | sort) ==
                      ["api", "keycloak", "mcp", "postgres-rag", "web", "worker"] and
                    all(.images[];
                      (.digest | test("^sha256:[0-9a-f]{64}$")) and
                      (.sourceSha | test("^[0-9a-f]{40}$")) and
                      (.built | type) == "boolean" and
                      .reference ==
                        ("ghcr.io/kl3init/orgmemory-" + .component + ":sha-" + $candidate)
                    )
                  ' "$artifact_dir/release-images.json" >/dev/null; then
                  valid_sources=true
                  while IFS= read -r source_sha; do
                    if ! git cat-file -e "$source_sha^{commit}" 2>/dev/null ||
                      ! git merge-base --is-ancestor "$source_sha" "$candidate"; then
                      valid_sources=false
                      break
                    fi
                  done < <(jq -r '.images[].sourceSha' "$artifact_dir/release-images.json")
                  if [[ "$valid_sources" != true ]]; then
                    rm -rf -- "$artifact_dir"
                    continue
                  fi
                  base_sha="$candidate"
                  base_images="$(
                    jq -c '.images |
                      map({
                        key: .component,
                        value: {digest: .digest, sourceSha: .sourceSha}
                      }) |
                      from_entries' \
                      "$artifact_dir/release-images.json"
                  )"
                  rm -rf -- "$artifact_dir"
                  break
                fi
                rm -rf -- "$artifact_dir"
              fi
            fi
          done <<< "$candidates"
          printf 'base_sha=%s\n' "$base_sha" >> "$GITHUB_OUTPUT"
          printf 'base_images=%s\n' "$base_images" >> "$GITHUB_OUTPUT"

      - name: Detect image dependency changes
        id: filter
        if: steps.base.outputs.base_sha != ''
        uses: dorny/paths-filter@v4.0.3
        with:
          base: ${{ steps.base.outputs.base_sha }}
          ref: ${{ github.event.workflow_run.head_sha }}
          filters: |
            api:
              - ".dockerignore"
              - ".github/workflows/build-images.yml"
              - "build.gradle.kts"
              - "settings.gradle.kts"
              - "gradle/**"
              - "gradlew"
              - "gradlew.bat"
              - "build-logic/**"
              - "infrastructure/images/spring-boot-app.Dockerfile"
              - "apps/api/**"
              - "core/**"
              - "components/graph-rag-core/**"
              - "integrations/ai-model-gateways/**"
              - "integrations/ai-openai-compatible/**"
              - "integrations/authorization-openfga/**"
              - "integrations/connectors/**"
              - "integrations/graph-rag-observability/**"
              - "integrations/graph-rag-postgres/**"
              - "integrations/graph-rag-spring-ai/**"
              - "integrations/object-storage-minio/**"
            worker:
              - ".dockerignore"
              - ".github/workflows/build-images.yml"
              - "build.gradle.kts"
              - "settings.gradle.kts"
              - "gradle/**"
              - "gradlew"
              - "gradlew.bat"
              - "build-logic/**"
              - "infrastructure/images/spring-boot-app.Dockerfile"
              - "apps/worker/**"
              - "core/**"
              - "components/graph-rag-core/**"
              - "integrations/ai-model-gateways/**"
              - "integrations/ai-openai-compatible/**"
              - "integrations/authorization-openfga/**"
              - "integrations/connectors/**"
              - "integrations/graph-rag-observability/**"
              - "integrations/graph-rag-postgres/**"
              - "integrations/graph-rag-spring-ai/**"
              - "integrations/object-storage-minio/**"
            mcp:
              - ".dockerignore"
              - ".github/workflows/build-images.yml"
              - "build.gradle.kts"
              - "settings.gradle.kts"
              - "gradle/**"
              - "gradlew"
              - "gradlew.bat"
              - "build-logic/**"
              - "infrastructure/images/spring-boot-app.Dockerfile"
              - "apps/mcp/**"
            web:
              - ".dockerignore"
              - ".github/workflows/build-images.yml"
              - "apps/cli/package.json"
              - "apps/docs/package.json"
              - "contracts/**"
              - "package.json"
              - "patches/**"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "apps/web/**"
            keycloak:
              - ".dockerignore"
              - ".github/workflows/build-images.yml"
              - "package.json"
              - "patches/**"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "infrastructure/keycloak/**"
            postgres_rag:
              - ".dockerignore"
              - ".github/workflows/build-images.yml"
              - "infrastructure/postgres-rag/**"

      - name: Assemble immutable image-set plan
        id: plan
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
          API_CHANGED: ${{ steps.filter.outputs.api }}
          WORKER_CHANGED: ${{ steps.filter.outputs.worker }}
          MCP_CHANGED: ${{ steps.filter.outputs.mcp }}
          WEB_CHANGED: ${{ steps.filter.outputs.web }}
          KEYCLOAK_CHANGED: ${{ steps.filter.outputs.keycloak }}
          POSTGRES_CHANGED: ${{ steps.filter.outputs.postgres_rag }}
        run: |
          set -euo pipefail
          all='["api","worker","mcp","web","keycloak","postgres-rag"]'
          if [[ -z "$BASE_SHA" ]]; then
            changed="$all"
          else
            changed="$(
              jq -cn \
                --arg api "$API_CHANGED" \
                --arg worker "$WORKER_CHANGED" \
                --arg mcp "$MCP_CHANGED" \
                --arg web "$WEB_CHANGED" \
                --arg keycloak "$KEYCLOAK_CHANGED" \
                --arg postgres "$POSTGRES_CHANGED" \
                '[
                  ["api", $api],
                  ["worker", $worker],
                  ["mcp", $mcp],
                  ["web", $web],
                  ["keycloak", $keycloak],
                  ["postgres-rag", $postgres]
                ] |
                map(select(.[1] == "true") | .[0])'
            )"
          fi
          unchanged="$(
            jq -cn \
              --argjson all "$all" \
              --argjson changed "$changed" \
              '$all - $changed'
          )"
          {
            printf 'base_sha=%s\n' "$BASE_SHA"
            printf 'changed=%s\n' "$changed"
            printf 'unchanged=%s\n' "$unchanged"
          } >> "$GITHUB_OUTPUT"
          printf 'Changed images: %s\n' "$changed"
          printf 'Carried-forward images: %s\n' "$unchanged"
          if [[ "$changed" == "[]" ]]; then
            printf 'No product image inputs changed; release is a no-op.\n'
          fi

  images:
    name: Image · ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.changed != '[]'
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.plan.outputs.changed) }}
    steps:
      - name: Check out verified source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image build contract
        id: contract
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          case "$IMAGE_NAME" in
            api|worker|mcp)
              file="infrastructure/images/spring-boot-app.Dockerfile"
              build_args="APP_NAME=$IMAGE_NAME"
              ;;
            web)
              file="apps/web/Dockerfile"
              build_args=""
              ;;
            keycloak)
              file="infrastructure/keycloak/Dockerfile"
              build_args=""
              ;;
            postgres-rag)
              file="infrastructure/postgres-rag/Dockerfile"
              build_args=""
              ;;
            *)
              printf 'Unknown production image: %s\n' "$IMAGE_NAME" >&2
              exit 64
              ;;
          esac
          {
            printf 'file=%s\n' "$file"
            printf 'build_args<<EOF\n'
            printf '%s\n' "$build_args"
            printf 'EOF\n'
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ${{ steps.contract.outputs.file }}
          push: true
          tags: ghcr.io/kl3init/orgmemory-${{ matrix.name }}:sha-${{ github.event.workflow_run.head_sha }}
          build-args: |
            VCS_REF=${{ github.event.workflow_run.head_sha }}
            BUILD_DATE=${{ github.event.workflow_run.updated_at }}
            ${{ steps.contract.outputs.build_args }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: mode=max
          sbom: true

      - name: Scan published image
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ghcr.io/kl3init/orgmemory-${{ matrix.name }}:sha-${{ github.event.workflow_run.head_sha }}
          format: table
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "0"

  carry-forward:
    name: Carry forward unchanged image digests
    needs: plan
    if: >-
      needs.plan.outputs.changed != '[]' &&
      needs.plan.outputs.unchanged != '[]'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy unchanged manifests without rebuilding
        shell: bash
        env:
          BASE_IMAGES: ${{ needs.plan.outputs.base_images }}
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          UNCHANGED: ${{ needs.plan.outputs.unchanged }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          while IFS= read -r image; do
            source_digest="$(jq -r --arg image "$image" '.[$image].digest // empty' <<< "$BASE_IMAGES")"
            jq -en --arg digest "$source_digest" \
              '$digest | test("^sha256:[0-9a-f]{64}$")' >/dev/null
            source="ghcr.io/kl3init/orgmemory-${image}@${source_digest}"
            target="ghcr.io/kl3init/orgmemory-${image}:sha-${HEAD_SHA}"
            docker buildx imagetools create \
              --prefer-index=false \
              --tag "$target" \
              "$source"
          done < <(jq -r '.[]' <<< "$UNCHANGED")

  release:
    name: Verify immutable image set
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.changed != '[]' &&
      (needs.images.result == 'success' || needs.images.result == 'skipped') &&
      (needs.carry-forward.result == 'success' || needs.carry-forward.result == 'skipped')
    permissions:
      actions: read
      contents: read
      packages: read
    needs:
      - plan
      - images
      - carry-forward
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and record the complete release
        shell: bash
        env:
          BASE_IMAGES: ${{ needs.plan.outputs.base_images }}
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          CHANGED: ${{ needs.plan.outputs.changed }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          printf '{"commitSha":"%s","images":[' "$HEAD_SHA" > release-images.json
          separator=""
          for image in api worker mcp web keycloak postgres-rag; do
            reference="ghcr.io/kl3init/orgmemory-${image}:sha-${HEAD_SHA}"
            digest="$(
              docker buildx imagetools inspect "$reference" \
                --format '{{json .Manifest.Digest}}' |
              jq -r .
            )"
            jq -en --arg digest "$digest" \
              '$digest | test("^sha256:[0-9a-f]{64}$")' >/dev/null
            if jq -e --arg image "$image" \
              'index($image) != null' <<< "$CHANGED" >/dev/null; then
              source_sha="$HEAD_SHA"
              built=true
            else
              built=false
              source_digest="$(jq -r --arg image "$image" '.[$image].digest // empty' <<< "$BASE_IMAGES")"
              source_sha="$(jq -r --arg image "$image" '.[$image].sourceSha // empty' <<< "$BASE_IMAGES")"
              jq -en --arg digest "$source_digest" \
                '$digest | test("^sha256:[0-9a-f]{64}$")' >/dev/null
              jq -en --arg source_sha "$source_sha" \
                '$source_sha | test("^[0-9a-f]{40}$")' >/dev/null
              if [[ "$source_digest" != "$digest" ]]; then
                printf 'Carried-forward digest mismatch for %s: %s != %s\n' \
                  "$image" "$source_digest" "$digest" >&2
                exit 65
              fi
            fi
            printf '%s' "$separator" >> release-images.json
            jq -cn \
              --arg component "$image" \
              --arg reference "$reference" \
              --arg digest "$digest" \
              --arg sourceSha "$source_sha" \
              --argjson built "$built" \
              '{
                component: $component,
                reference: $reference,
                digest: $digest,
                sourceSha: $sourceSha,
                built: $built
              }' >> release-images.json
            separator=","
          done
          printf ']}\n' >> release-images.json
          jq . release-images.json

      - name: Upload release image manifest
        uses: actions/upload-artifact@v7.0.1
        with:
          name: production-image-set-${{ github.event.workflow_run.head_sha }}
          path: release-images.json
          if-no-files-found: error
          retention-days: 30
