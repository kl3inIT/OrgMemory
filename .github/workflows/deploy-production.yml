name: Deploy production

on:
  workflow_run:
    workflows:
      - Build production images
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full green main commit SHA to redeploy or roll back to
        required: true
        type: string

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: orgmemory-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy exact image set
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://om.kl3in.tech
    steps:
      - name: Check out main history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve deployment commit
        id: release
        shell: bash
        env:
          AUTOMATIC_COMMIT_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_COMMIT_SHA: ${{ inputs.commit_sha || '' }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            commit_sha="$MANUAL_COMMIT_SHA"
            automatic=false
          else
            commit_sha="$AUTOMATIC_COMMIT_SHA"
            automatic=true
          fi
          [[ "$commit_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'commit_sha=%s\n' "$commit_sha" >> "$GITHUB_OUTPUT"
          printf 'automatic=%s\n' "$automatic" >> "$GITHUB_OUTPUT"

      - name: Validate commit input
        id: validate
        shell: bash
        env:
          AUTOMATIC: ${{ steps.release.outputs.automatic }}
          COMMIT_SHA: ${{ steps.release.outputs.commit_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git cat-file -e "$COMMIT_SHA^{commit}"
          git merge-base --is-ancestor "$COMMIT_SHA" origin/main
          if [[ "$AUTOMATIC" == "true" &&
                "$COMMIT_SHA" != "$(git rev-parse origin/main)" ]]; then
            printf 'Skipping stale automatic deployment %s; main is now %s.\n' \
              "$COMMIT_SHA" "$(git rev-parse origin/main)"
            printf 'should_deploy=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'should_deploy=true\n' >> "$GITHUB_OUTPUT"

      - name: Require a green production image set
        if: steps.validate.outputs.should_deploy == 'true'
        shell: bash
        env:
          COMMIT_SHA: ${{ steps.release.outputs.commit_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          successful_runs="$(
            gh run list \
              --workflow "Build production images" \
              --commit "$COMMIT_SHA" \
              --limit 20 \
              --json conclusion \
              --jq '[.[] | select(.conclusion == "success")] | length'
          )"
          [[ "$successful_runs" -gt 0 ]]

      - name: Configure SSH
        if: steps.validate.outputs.should_deploy == 'true'
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          install -m 0600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          install -m 0600 /dev/null ~/.ssh/known_hosts
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy and verify with ephemeral registry credentials
        if: steps.validate.outputs.should_deploy == 'true'
        shell: bash
        env:
          COMMIT_SHA: ${{ steps.release.outputs.commit_sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail
          printf '%s\n' "$GHCR_TOKEN" |
            ssh \
              -o BatchMode=yes \
              -o ConnectTimeout=10 \
              -o ConnectionAttempts=1 \
              -p "${SSH_PORT:-22}" \
              "$SSH_USER@$SSH_HOST" \
              "set -Eeuo pipefail
             docker_config=\$(mktemp -d /tmp/orgmemory-docker.XXXXXX)
             cleanup() {
               case \"\$docker_config\" in
                 /tmp/orgmemory-docker.*)
                   rm -rf -- \"\$docker_config\"
                   ;;
                 *)
                   printf 'Refusing unsafe Docker config cleanup: %s\n' \
                     \"\$docker_config\" >&2
                   return 1
                   ;;
               esac
             }
             trap cleanup EXIT
             export DOCKER_CONFIG=\"\$docker_config\"
             IFS= read -r ghcr_token
             printf '%s' \"\$ghcr_token\" |
               docker login ghcr.io \
                 --username '${{ github.actor }}' \
                 --password-stdin
             unset ghcr_token
             cd /apps/orgmemory
             git fetch --no-tags origin '$COMMIT_SHA' &&
             git checkout --detach '$COMMIT_SHA' &&
             ./infrastructure/deployment/scripts/deploy.sh '$COMMIT_SHA'"
