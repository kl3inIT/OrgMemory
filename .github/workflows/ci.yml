name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - light-rag
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      cli: ${{ steps.filter.outputs.cli }}
      docs: ${{ steps.filter.outputs.docs }}
      public_docs: ${{ steps.filter.outputs.public_docs }}
      openfga: ${{ steps.filter.outputs.openfga }}
      evaluation: ${{ steps.filter.outputs.evaluation }}
      postgres: ${{ steps.filter.outputs.postgres }}
      opensearch: ${{ steps.filter.outputs.opensearch }}
      neo4j: ${{ steps.filter.outputs.neo4j }}
      deployment: ${{ steps.filter.outputs.deployment }}
      release: ${{ steps.filter.outputs.release }}
      all: ${{ steps.filter.outputs.all }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Detect affected verification surfaces
        id: filter
        uses: dorny/paths-filter@v4.0.2
        with:
          filters: |
            all:
              - ".github/workflows/ci.yml"
              - "build-logic/**"
              - "gradle/**"
              - "gradlew"
              - "gradlew.bat"
              - "settings.gradle.kts"
              - "build.gradle.kts"
            backend:
              - "apps/**"
              - "build-logic/**"
              - "!apps/cli/**"
              - "!apps/web/**"
              - "!apps/docs/**"
              - "components/**"
              - "core/**"
              - "integrations/**"
              - "!integrations/authorization-openfga/src/test/openfga/**"
              - "!integrations/graph-rag-postgres/**"
              - "!integrations/graph-rag-opensearch/**"
              - "!integrations/graph-rag-neo4j/**"
            web:
              - "apps/web/**"
              - "contracts/**"
              - "apps/api/src/main/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
            cli:
              - "apps/cli/**"
              - "apps/mcp/src/main/**"
              - "contracts/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
            docs:
              - "AGENTS.md"
              - "CLAUDE.md"
              - "ARCHITECTURE.md"
              - "docs/**"
              - "scripts/check_docs.py"
            public_docs:
              - ".github/workflows/build-docs.yml"
              - ".github/workflows/deploy-docs.yml"
              - "apps/docs/**"
              - "patches/**"
              - "contracts/openapi.json"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
            openfga:
              - "integrations/authorization-openfga/**"
              - "core/src/**/authorization/**"
            evaluation:
              - "evaluation/**"
              - "gradle/**"
              - "components/graph-rag-core/**"
              - "core/src/**/knowledge/**"
            postgres:
              - "infrastructure/postgres-rag/**"
              - "integrations/graph-rag-postgres/**"
              - "components/graph-rag-core/**"
              - "components/graph-rag-testkit/**"
              - "core/src/main/resources/db/migration/**"
            opensearch:
              - "integrations/graph-rag-opensearch/**"
              - "components/graph-rag-core/**"
              - "components/graph-rag-testkit/**"
            neo4j:
              - "integrations/graph-rag-neo4j/**"
              - "components/graph-rag-core/**"
              - "components/graph-rag-testkit/**"
            deployment:
              - ".dockerignore"
              - ".github/workflows/build-images.yml"
              - ".github/workflows/build-docs.yml"
              - ".github/workflows/deploy-docs.yml"
              - ".github/workflows/deploy-production.yml"
              - ".github/workflows/release.yml"
              - ".github/workflows/tegami-pr.yml"
              - ".github/workflows/tegami-pr-comment.yml"
              - "compose.yaml"
              - "infrastructure/deployment/**"
              - "infrastructure/images/**"
              - "infrastructure/keycloak/**"
              - "infrastructure/postgres-rag/**"
              - "patches/**"
              - "apps/web/Dockerfile"
              - "apps/web/nginx.conf"
              - "apps/docs/Dockerfile"
              - "apps/docs/Dockerfile.dockerignore"
            release:
              - "apps/**"
              - "build-logic/**"
              - "components/**"
              - "contracts/**"
              - "core/**"
              - "evaluation/**"
              - "gradle/**"
              - "integrations/**"
              - "infrastructure/**"
              - "patches/**"
              - ".github/workflows/**"
              - ".dockerignore"
              - "build.gradle.kts"
              - "compose.yaml"
              - "gradlew"
              - "gradlew.bat"
              - "settings.gradle.kts"
              - ".gitleaksignore"
              - ".tegami/**"
              - ".github/workflows/ci.yml"
              - ".github/workflows/release.yml"
              - ".github/workflows/tegami-pr.yml"
              - ".github/workflows/tegami-pr-comment.yml"
              - "release/**"
              - "scripts/check-release.mjs"
              - "scripts/check-publish-lock.mts"
              - "scripts/resolve-release-artifacts.mjs"
              - "scripts/release-policy.mjs"
              - "scripts/release-policy.test.mjs"
              - "scripts/release-workflow-policy.mjs"
              - "scripts/release-workflow-policy.test.mjs"
              - "scripts/tegami-config.mts"
              - "scripts/tegami.mts"
              - "scripts/tegami-product.mts"
              - "scripts/tegami-product.test.mts"
              - "scripts/tsconfig.release.json"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"

  secrets:
    name: Secret scan · Gitleaks 8.30.1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" \
            --directory "$RUNNER_TEMP" gitleaks

      - name: Scan repository history without printing secret values
        run: >-
          "$RUNNER_TEMP/gitleaks"
          git --redact --no-banner --verbose .

  backend:
    name: Backend · Java 25
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Run backend test suite
        run: >-
          ./gradlew --no-daemon clean build
          -x :integrations:graph-rag-postgres:test
          -x :integrations:graph-rag-opensearch:test
          -x :integrations:graph-rag-neo4j:test

  web:
    name: Web · Node 24
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated API client
        run: pnpm --filter @orgmemory/web check:api

      - name: Type-check
        run: pnpm --filter @orgmemory/web typecheck

      - name: Run focused component tests
        run: pnpm --filter @orgmemory/web test:unit

      - name: Build production bundle
        run: pnpm --filter @orgmemory/web build

      - name: Install Playwright browser
        run: pnpm --filter @orgmemory/web exec playwright install --with-deps chromium

      - name: Run browser tests
        run: pnpm --filter @orgmemory/web test:e2e

      - name: Check generated route tree
        run: git diff --exit-code -- apps/web/src/routeTree.gen.ts

  cli:
    name: CLI · Node 24
    needs: changes
    if: needs.changes.outputs.cli == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm --filter @orgmemory/cli typecheck

      - name: Run focused tests
        run: pnpm --filter @orgmemory/cli test

      - name: Build distributable
        run: pnpm --filter @orgmemory/cli build

  docs:
    name: Documentation operating model
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"

      - name: Validate documentation structure and links
        run: python scripts/check_docs.py

  release:
    name: Product release · Node 24
    needs: changes
    if: needs.changes.outputs.release == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify product release contracts
        run: pnpm release:check

  public_docs:
    name: Public docs · Node 24
    needs: changes
    if: needs.changes.outputs.public_docs == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate publication contracts
        run: pnpm --filter @orgmemory/docs check

      - name: Install Playwright browser
        run: pnpm --filter @orgmemory/docs exec playwright install --with-deps chromium

      - name: Test documentation navigation and accessibility
        run: pnpm --filter @orgmemory/docs test:e2e

      - name: Build production documentation
        env:
          DOCS_DEPLOYMENT_MODE: production
          DOCS_INCLUDE_DRAFTS: "false"
        run: pnpm --filter @orgmemory/docs build

      - name: Audit public client output
        run: pnpm --filter @orgmemory/docs check:output

  openfga:
    name: OpenFGA model
    needs: changes
    if: needs.changes.outputs.openfga == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install OpenFGA CLI
        uses: jaxxstorm/action-install-gh-release@v3.0.0
        with:
          repo: openfga/cli
          tag: v0.7.19
          cache: enable

      - name: Test authorization model
        working-directory: integrations/authorization-openfga/src/test/openfga
        run: fga model test --tests store.fga.yaml

  evaluation:
    name: Evaluation · Python 3.13
    needs: changes
    if: needs.changes.outputs.evaluation == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: evaluation
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: evaluation/uv.lock

      - name: Install locked evaluation environment
        run: uv sync --frozen --dev

      - name: Lint evaluation tooling
        run: uv run ruff check .

      - name: Test deterministic evaluation contracts
        run: uv run pytest

  postgres:
    name: PostgreSQL GraphRAG
    needs: changes
    if: needs.changes.outputs.postgres == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Build PostgreSQL GraphRAG test image
        run: >-
          docker build
          --file infrastructure/postgres-rag/Dockerfile
          --tag orgmemory/postgres-rag:pg18-age1.8.0-rc0-pgvector0.8.4
          .

      - name: Test PostgreSQL GraphRAG adapter
        env:
          ORGMEMORY_POSTGRES_RAG_TEST_IMAGE: orgmemory/postgres-rag:pg18-age1.8.0-rc0-pgvector0.8.4
        run: ./gradlew --no-daemon :integrations:graph-rag-postgres:test

  opensearch:
    name: OpenSearch adapter
    needs: changes
    if: needs.changes.outputs.opensearch == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Test OpenSearch adapter
        run: ./gradlew --no-daemon :integrations:graph-rag-opensearch:test

  neo4j:
    name: Neo4j adapter
    needs: changes
    if: needs.changes.outputs.neo4j == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Test Neo4j adapter
        run: ./gradlew --no-daemon :integrations:graph-rag-neo4j:test

  deployment:
    name: Deployment contracts
    needs: changes
    if: needs.changes.outputs.deployment == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Validate GitHub Actions workflows
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' scripts < <(
            find infrastructure -type f -name '*.sh' -print0
          )
          docker run --rm \
            --volume "$PWD:/repo:ro" \
            --workdir /repo \
            koalaman/shellcheck-alpine:v0.11.0 \
            shellcheck \
            "${scripts[@]}"

      - name: Validate production Compose interpolation
        shell: bash
        env:
          ORGMEMORY_API_IMAGE: example.invalid/orgmemory-api:sha-ci
          ORGMEMORY_WORKER_IMAGE: example.invalid/orgmemory-worker:sha-ci
          ORGMEMORY_MCP_IMAGE: example.invalid/orgmemory-mcp:sha-ci
          ORGMEMORY_WEB_IMAGE: example.invalid/orgmemory-web:sha-ci
          ORGMEMORY_KEYCLOAK_IMAGE: example.invalid/orgmemory-keycloak:sha-ci
          ORGMEMORY_POSTGRES_IMAGE: example.invalid/orgmemory-postgres-rag:sha-ci
          SHARED_POSTGRES_ADMIN_USER: postgres
          SHARED_POSTGRES_ADMIN_PASSWORD: ci-only
          ORGMEMORY_DB_PASSWORD: ci-only
          OPENFGA_DB_PASSWORD: ci-only
          OPENFGA_DATASTORE_URI: postgres://openfga:ci-only@postgres:5432/openfga?sslmode=disable
          KEYCLOAK_DB_PASSWORD: ci-only
          KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME: ci-admin
          KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD: ci-only
          ORGMEMORY_OIDC_CLIENT_SECRET: ci-only
          ORGMEMORY_MCP_OIDC_CLIENT_SECRET: ci-only
          ORGMEMORY_SCIM_VERIFIER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          ORGMEMORY_SCIM_VERIFIER_KEY_VERSION: 1
          ORGMEMORY_OBJECT_STORAGE_ACCESS_KEY: ci-only
          ORGMEMORY_OBJECT_STORAGE_SECRET_KEY: ci-only
          ORGMEMORY_OPENAI_API_KEY: ci-only
          ORGMEMORY_SECRETS_KEY: ci-only
          ORGMEMORY_SECRETS_SALT: ci-only
        run: >-
          docker compose
          --file infrastructure/deployment/compose.production.yaml
          --env-file infrastructure/deployment/production.env.example
          config --quiet

      - name: Validate docs Compose interpolation
        run: >-
          docker compose
          --file infrastructure/deployment/compose.docs.yaml
          --env-file infrastructure/deployment/docs.env.example
          config --quiet

      - name: Prove docs-only failed-canary rollback
        run: infrastructure/deployment/scripts/test-deploy-docs-rollback.sh

      - name: Prove OpenFGA model rollout and rollback
        run: infrastructure/deployment/scripts/test-deploy-openfga-model-rollout.sh

      - name: Validate publication verifier
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            infrastructure/deployment/scripts/verify-docs-publication.py
          python3 \
            infrastructure/deployment/scripts/test_verify_docs_publication.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Validate production Dockerfiles
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --check \
            --file infrastructure/images/spring-boot-app.Dockerfile \
            --build-arg APP_NAME=api \
            .
          docker buildx build --check --file apps/web/Dockerfile .
          docker buildx build --check --file apps/docs/Dockerfile .
          docker buildx build --check --file infrastructure/keycloak/Dockerfile .
          docker buildx build --check --file infrastructure/postgres-rag/Dockerfile .

      - name: Build web Docker dependency contract
        run: >-
          docker buildx build
          --file apps/web/Dockerfile
          --target build
          .

      - name: Test web forwarded-port handling
        run: infrastructure/deployment/scripts/test-web-forwarded-port.sh

      - name: Test Keycloak MCP client onboarding
        run: infrastructure/deployment/scripts/test-keycloak-mcp-onboarding.sh

  gate:
    name: CI Gate
    if: always()
    needs:
      - changes
      - secrets
      - backend
      - web
      - cli
      - docs
      - public_docs
      - openfga
      - evaluation
      - postgres
      - opensearch
      - neo4j
      - deployment
      - release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification job to pass
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          WEB_RESULT: ${{ needs.web.result }}
          CLI_RESULT: ${{ needs.cli.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          PUBLIC_DOCS_RESULT: ${{ needs.public_docs.result }}
          OPENFGA_RESULT: ${{ needs.openfga.result }}
          EVALUATION_RESULT: ${{ needs.evaluation.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
          OPENSEARCH_RESULT: ${{ needs.opensearch.result }}
          NEO4J_RESULT: ${{ needs.neo4j.result }}
          DEPLOYMENT_RESULT: ${{ needs.deployment.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: |
          set -euo pipefail
          [[ "$CHANGES_RESULT" == "success" ]]
          [[ "$SECRETS_RESULT" == "success" ]]
          for result in \
            "$BACKEND_RESULT" \
            "$WEB_RESULT" \
            "$CLI_RESULT" \
            "$DOCS_RESULT" \
            "$PUBLIC_DOCS_RESULT" \
            "$OPENFGA_RESULT" \
            "$EVALUATION_RESULT" \
            "$POSTGRES_RESULT" \
            "$OPENSEARCH_RESULT" \
            "$NEO4J_RESULT" \
            "$DEPLOYMENT_RESULT" \
            "$RELEASE_RESULT"
          do
            [[ "$result" == "success" || "$result" == "skipped" ]]
          done
