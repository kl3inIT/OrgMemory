spring:
  lifecycle:
    timeout-per-shutdown-phase: ${ORGMEMORY_SHUTDOWN_TIMEOUT:30s}
  datasource:
    url: ${ORGMEMORY_DB_URL}
    username: ${ORGMEMORY_DB_USER}
    password: ${ORGMEMORY_DB_PASSWORD}
    hikari:
      pool-name: orgmemory-api
      maximum-pool-size: ${ORGMEMORY_API_DB_POOL_MAXIMUM_SIZE:12}
      minimum-idle: ${ORGMEMORY_API_DB_POOL_MINIMUM_IDLE:2}
      connection-timeout: ${ORGMEMORY_DB_CONNECTION_TIMEOUT_MS:10000}
      validation-timeout: ${ORGMEMORY_DB_VALIDATION_TIMEOUT_MS:5000}
      max-lifetime: ${ORGMEMORY_DB_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${ORGMEMORY_DB_KEEPALIVE_TIME_MS:120000}
  ai:
    openai:
      api-key: ${ORGMEMORY_OPENAI_API_KEY}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ORGMEMORY_OIDC_ISSUER_URI}
          jwk-set-uri: ${ORGMEMORY_OIDC_JWK_SET_URI}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

orgmemory:
  ai:
    gateways:
      openai:
        api-key: ${ORGMEMORY_OPENAI_API_KEY}
  authorization:
    openfga:
      api-url: ${ORGMEMORY_OPENFGA_API_URL}
      store-id: ${ORGMEMORY_OPENFGA_STORE_ID}
      authorization-model-id: ${ORGMEMORY_OPENFGA_AUTHORIZATION_MODEL_ID}
  storage:
    object:
      endpoint: ${ORGMEMORY_OBJECT_STORAGE_ENDPOINT}
      access-key: ${ORGMEMORY_OBJECT_STORAGE_ACCESS_KEY}
      secret-key: ${ORGMEMORY_OBJECT_STORAGE_SECRET_KEY}
      bucket: ${ORGMEMORY_OBJECT_STORAGE_BUCKET}
  security:
    scim:
      verifier-key: ${ORGMEMORY_SCIM_VERIFIER_KEY}
      current-key-version: ${ORGMEMORY_SCIM_VERIFIER_KEY_VERSION}
      require-tls: true
    oidc:
      issuer-uri: ${ORGMEMORY_OIDC_ISSUER_URI}
      client-id: ${ORGMEMORY_OIDC_CLIENT_ID}
      client-secret: ${ORGMEMORY_OIDC_CLIENT_SECRET}
      web-base-url: ${ORGMEMORY_WEB_BASE_URL}

server:
  forward-headers-strategy: framework
  shutdown: graceful
  tomcat:
    max-connections: ${ORGMEMORY_API_MAX_CONNECTIONS:200}
    accept-count: ${ORGMEMORY_API_ACCEPT_COUNT:100}
  servlet:
    session:
      cookie:
        secure: true

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: ${ORGMEMORY_HEALTH_SHOW_DETAILS:always}
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: ${ORGMEMORY_ROOT_LOG_LEVEL:INFO}
    com.orgmemory: ${ORGMEMORY_APP_LOG_LEVEL:DEBUG}
    org.springframework.security: ${ORGMEMORY_SECURITY_LOG_LEVEL:INFO}
    org.hibernate.SQL: ${ORGMEMORY_SQL_LOG_LEVEL:INFO}
