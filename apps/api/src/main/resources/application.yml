spring:
  application:
    name: orgmemory-api
  ai:
    chat:
      memory:
        repository:
          jdbc:
            # Flyway owns the Spring AI 2.0 schema in V5.
            initialize-schema: never
      # Spring AI has two content-flag families with the same names one layer apart:
      # `chat.client.observations` governs the ChatClient, `chat.observations` the
      # ChatModel underneath it, and SpringAiChatModelAdapter builds every call
      # through both. All are already false by default; declared so the payload
      # posture reads as one block rather than several settings and an assumption.
      #
      # Declaring them is the default, not the enforcement.
      # ObservationContentBoundaryVerifier refuses to start when any Spring AI
      # content flag resolves true, including the image and tool-calling families
      # that no OrgMemory path exercises today and that are therefore not written
      # out here. See docs/decisions/0018-telemetry-carries-counts-never-payload.md.
      client:
        observations:
          log-prompt: false
          log-completion: false
      observations:
        log-prompt: false
        log-completion: false
        include-error-logging: false
    model:
      chat: ${ORGMEMORY_AI_MODEL_CHAT:none}
      embedding: ${ORGMEMORY_AI_MODEL_EMBEDDING:openai}
    openai:
      api-key: ${OPENAI_API_KEY:${ORGMEMORY_OPENAI_API_KEY:}}
      chat:
        model: ${ORGMEMORY_OPENAI_MODEL:gpt-5.6-sol}
      embedding:
        model: ${ORGMEMORY_OPENAI_EMBEDDING_MODEL:text-embedding-3-large}
        dimensions: ${ORGMEMORY_OPENAI_EMBEDDING_DIMENSIONS:1536}
  config:
    import: optional:file:.env[.properties],optional:file:../../.env[.properties],optional:file:.openfga.local.properties,optional:file:../../.openfga.local.properties
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${ORGMEMORY_DB_URL:jdbc:postgresql://localhost:${ORGMEMORY_POSTGRES_PORT:15432}/orgmemory}
    username: ${ORGMEMORY_DB_USER:orgmemory}
    password: ${ORGMEMORY_DB_PASSWORD:orgmemory}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ORGMEMORY_OIDC_ISSUER_URI:http://localhost:8180/realms/orgmemory}
  session:
    timeout: ${ORGMEMORY_WEB_SESSION_TIMEOUT:8h}
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      max-file-size: ${ORGMEMORY_MAX_UPLOAD_SIZE:25MB}
      max-request-size: ${ORGMEMORY_MAX_UPLOAD_SIZE:25MB}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

orgmemory:
  secrets:
    key: ${ORGMEMORY_SECRETS_KEY:orgmemory-local-dev-only-secret-key}
    salt: ${ORGMEMORY_SECRETS_SALT:6f72676d656d6f7279736563726574}
    version: ${ORGMEMORY_SECRETS_KEY_VERSION:1}
  assistant:
    heartbeat-interval: ${ORGMEMORY_ASSISTANT_HEARTBEAT_INTERVAL:15s}
    turn-timeout: ${ORGMEMORY_ASSISTANT_TURN_TIMEOUT:2m}
    retrieval-engine: ${ORGMEMORY_ASSISTANT_RETRIEVAL_ENGINE:GRAPH_RAG}
  ai:
    gateways:
      openai:
        display-name: OpenAI
        base-url: ${ORGMEMORY_OPENAI_BASE_URL:https://api.openai.com/v1}
        api-key: ${OPENAI_API_KEY:${ORGMEMORY_OPENAI_API_KEY:}}
        capabilities: [CHAT, EMBEDDING]
        timeout: ${ORGMEMORY_AI_GATEWAY_TIMEOUT:60s}
        supports-open-ai-reasoning-effort: ${ORGMEMORY_OPENAI_REASONING_EFFORT_SUPPORTED:false}
    routes:
      assistant-chat:
        gateway-id: ${ORGMEMORY_ASSISTANT_GATEWAY:openai}
        model-id: ${ORGMEMORY_OPENAI_MODEL:gpt-5.6-sol}
      keyword-planning:
        gateway-id: ${ORGMEMORY_KEYWORD_GATEWAY:${ORGMEMORY_ASSISTANT_GATEWAY:openai}}
        model-id: ${ORGMEMORY_KEYWORD_MODEL:${ORGMEMORY_OPENAI_MODEL:gpt-5.6-sol}}
        open-ai-reasoning-effort: ${ORGMEMORY_KEYWORD_OPENAI_REASONING_EFFORT:}
      graph-extraction:
        gateway-id: ${ORGMEMORY_GRAPH_EXTRACTION_GATEWAY:openai}
        model-id: ${ORGMEMORY_GRAPH_EXTRACTION_MODEL:gpt-5.4-mini}
        open-ai-reasoning-effort: ${ORGMEMORY_GRAPH_EXTRACTION_OPENAI_REASONING_EFFORT:}
      embedding:
        gateway-id: ${ORGMEMORY_EMBEDDING_GATEWAY:openai}
        model-id: ${ORGMEMORY_OPENAI_EMBEDDING_MODEL:text-embedding-3-large}
  retrieval:
    maximum-results: ${ORGMEMORY_RETRIEVAL_MAXIMUM_RESULTS:20}
    candidate-multiplier: ${ORGMEMORY_RETRIEVAL_CANDIDATE_MULTIPLIER:5}
    maximum-authorized-objects: ${ORGMEMORY_RETRIEVAL_MAXIMUM_AUTHORIZED_OBJECTS:5000}
    maximum-query-length: ${ORGMEMORY_RETRIEVAL_MAXIMUM_QUERY_LENGTH:1000}
    embedding:
      provider: ${ORGMEMORY_EMBEDDING_PROVIDER:openai}
      model: ${ORGMEMORY_OPENAI_EMBEDDING_MODEL:text-embedding-3-large}
      dimensions: ${ORGMEMORY_OPENAI_EMBEDDING_DIMENSIONS:1536}
  graph-rag:
    postgres:
      reconcile-published-batches: ${ORGMEMORY_GRAPH_RAG_POSTGRES_RECONCILE_PUBLISHED_BATCHES:false}
      reconciliation-page-size: ${ORGMEMORY_GRAPH_RAG_POSTGRES_RECONCILIATION_PAGE_SIZE:100}
      reconciliation-maximum-batches: ${ORGMEMORY_GRAPH_RAG_POSTGRES_RECONCILIATION_MAXIMUM_BATCHES:1000}
      reconciliation-maximum-entities: ${ORGMEMORY_GRAPH_RAG_POSTGRES_RECONCILIATION_MAXIMUM_ENTITIES:1000000}
      reconciliation-maximum-relation-contributions: ${ORGMEMORY_GRAPH_RAG_POSTGRES_RECONCILIATION_MAXIMUM_RELATION_CONTRIBUTIONS:1000000}
      provision-indexes: ${ORGMEMORY_GRAPH_RAG_POSTGRES_PROVISION_INDEXES:true}
    processing:
      maximum-entities-per-chunk: ${ORGMEMORY_GRAPH_MAX_ENTITIES_PER_CHUNK:40}
      maximum-relations-per-chunk: ${ORGMEMORY_GRAPH_MAX_RELATIONS_PER_CHUNK:60}
      entity-type-guidance: ${ORGMEMORY_GRAPH_ENTITY_TYPES:PERSON,ORGANIZATION,TEAM,ROLE,POLICY,PROCESS,SYSTEM,PRODUCT,DOCUMENT,LOCATION,EVENT,CONCEPT,OTHER}
      maximum-gleaning-rounds: ${ORGMEMORY_GRAPH_MAX_GLEANING_ROUNDS:1}
      maximum-gleaning-input-tokens: ${ORGMEMORY_GRAPH_MAX_GLEANING_INPUT_TOKENS:24000}
      maximum-section-context-tokens: ${ORGMEMORY_GRAPH_MAX_SECTION_CONTEXT_TOKENS:256}
    explorer:
      default-entity-limit: ${ORGMEMORY_GRAPH_EXPLORER_DEFAULT_ENTITY_LIMIT:200}
      maximum-entity-limit: ${ORGMEMORY_GRAPH_EXPLORER_MAXIMUM_ENTITY_LIMIT:1000}
      maximum-relation-limit: ${ORGMEMORY_GRAPH_EXPLORER_MAXIMUM_RELATION_LIMIT:2000}
      maximum-query-length: ${ORGMEMORY_GRAPH_EXPLORER_MAXIMUM_QUERY_LENGTH:200}
      default-maximum-depth: ${ORGMEMORY_GRAPH_EXPLORER_DEFAULT_MAXIMUM_DEPTH:3}
      maximum-depth: ${ORGMEMORY_GRAPH_EXPLORER_MAXIMUM_DEPTH:8}
    query:
      enabled: ${ORGMEMORY_GRAPH_QUERY_ENABLED:true}
      language: ${ORGMEMORY_GRAPH_QUERY_LANGUAGE:the same language as the user query}
      tokenizer-encoding: ${ORGMEMORY_GRAPH_QUERY_TOKENIZER:o200k_base}
      maximum-embedding-batch-size: ${ORGMEMORY_GRAPH_QUERY_EMBEDDING_BATCH_SIZE:64}
      keyword-cache-ttl: ${ORGMEMORY_GRAPH_QUERY_KEYWORD_CACHE_TTL:24h}
      maximum-knowledge-spaces: ${ORGMEMORY_GRAPH_QUERY_MAXIMUM_SPACES:20}
      maximum-concurrent-spaces: ${ORGMEMORY_GRAPH_QUERY_MAXIMUM_CONCURRENT_SPACES:4}
      top-k: ${ORGMEMORY_GRAPH_QUERY_TOP_K:60}
      chunk-top-k: ${ORGMEMORY_GRAPH_QUERY_CHUNK_TOP_K:20}
      related-chunk-number: ${ORGMEMORY_GRAPH_QUERY_RELATED_CHUNKS:5}
      maximum-graph-depth: ${ORGMEMORY_GRAPH_QUERY_MAXIMUM_DEPTH:1}
      maximum-evidence-closure: ${ORGMEMORY_GRAPH_QUERY_MAXIMUM_EVIDENCE_CLOSURE:2000}
      minimum-vector-similarity: ${ORGMEMORY_GRAPH_QUERY_MINIMUM_SIMILARITY:0.2}
      include-headings: ${ORGMEMORY_GRAPH_QUERY_INCLUDE_HEADINGS:true}
      rerank-enabled: ${ORGMEMORY_GRAPH_QUERY_RERANK_ENABLED:false}
      rerank-provider: ${ORGMEMORY_GRAPH_QUERY_RERANK_PROVIDER:none}
      minimum-rerank-score: ${ORGMEMORY_GRAPH_QUERY_MINIMUM_RERANK_SCORE:0.0}
  ingestion:
    maximum-upload-size: ${ORGMEMORY_MAX_UPLOAD_SIZE:25MB}
    maximum-attempts: ${ORGMEMORY_INGESTION_MAX_ATTEMPTS:5}
  storage:
    object:
      endpoint: ${ORGMEMORY_OBJECT_STORAGE_ENDPOINT:http://localhost:9000}
      access-key: ${ORGMEMORY_OBJECT_STORAGE_ACCESS_KEY:orgmemory-local}
      secret-key: ${ORGMEMORY_OBJECT_STORAGE_SECRET_KEY:orgmemory-local-secret}
      bucket: ${ORGMEMORY_OBJECT_STORAGE_BUCKET:orgmemory-evidence}
      maximum-object-size: ${ORGMEMORY_MAX_UPLOAD_SIZE:25MB}
  security:
    scim:
      verifier-key: ${ORGMEMORY_SCIM_VERIFIER_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA}
      current-key-version: ${ORGMEMORY_SCIM_VERIFIER_KEY_VERSION:1}
      previous-verifier-keys: ${ORGMEMORY_SCIM_PREVIOUS_VERIFIER_KEYS:}
      require-tls: ${ORGMEMORY_SCIM_REQUIRE_TLS:false}
      maximum-request-size: ${ORGMEMORY_SCIM_MAXIMUM_REQUEST_SIZE:256KB}
      requests-per-minute: ${ORGMEMORY_SCIM_REQUESTS_PER_MINUTE:120}
      token-ttl: ${ORGMEMORY_SCIM_TOKEN_TTL:90d}
      rotation-overlap: ${ORGMEMORY_SCIM_ROTATION_OVERLAP:15m}
    oidc:
      issuer-uri: ${ORGMEMORY_OIDC_ISSUER_URI:http://localhost:8180/realms/orgmemory}
      client-id: ${ORGMEMORY_OIDC_CLIENT_ID:orgmemory-web}
      client-secret: ${ORGMEMORY_OIDC_CLIENT_SECRET:orgmemory-local-dev-only}
      audience: ${ORGMEMORY_OIDC_AUDIENCE:${ORGMEMORY_OIDC_CLIENT_ID:orgmemory-web}}
      web-base-url: ${ORGMEMORY_WEB_BASE_URL:http://localhost:5173}

server:
  port: ${ORGMEMORY_API_PORT:8080}
  servlet:
    session:
      cookie:
        name: ORGMEMORY_SESSION
        http-only: true
        secure: ${ORGMEMORY_SESSION_COOKIE_SECURE:false}
        same-site: lax

management:
  tracing:
    sampling:
      probability: ${ORGMEMORY_TRACING_SAMPLING_PROBABILITY:0.1}
  metrics:
    distribution:
      # Without this a Micrometer timer exports exactly one bucket, `+Inf`, and
      # every `histogram_quantile` over it is NaN. Nothing errors: the count and
      # sum are exported, the panel is wired to the right metric, and the chart
      # is simply empty forever. Every latency panel on every board was in that
      # state until this was set.
      #
      # Percentile histograms rather than `distribution.percentiles`: a quantile
      # computed inside one instance cannot be re-aggregated across instances or
      # re-windowed by a dashboard, so client-side percentiles answer a narrower
      # question than the one the panels ask. Keys match by prefix, longest wins.
      percentiles-histogram:
        http.server.requests: true
        jvm.gc.pause: true
        orgmemory.assistant: true
        orgmemory.graph_rag: true
        gen_ai.client.operation: true
      # Bucket count is the series multiplier, and these meters are already
      # tagged — `orgmemory.graph_rag.stage` by thirteen stages. Bounding the
      # expected range bounds the buckets Micrometer generates within it.
      minimum-expected-value:
        http.server.requests: 5ms
        orgmemory.assistant: 50ms
        orgmemory.graph_rag: 5ms
        gen_ai.client.operation: 50ms
      maximum-expected-value:
        # The assistant and the model calls beneath it are answered by an LLM
        # over permission-scoped retrieval; ten seconds is a normal turn, so a
        # range that stops there would put every real answer in the top bucket.
        #
        # That applies to `http.server.requests` too, which is the mistake this
        # ceiling used to make: `/api/assistant/chat` is an HTTP request that
        # streams for the whole turn, so a ten-second ceiling sent every real
        # chat into the overflow bucket and pinned HTTP p95 at exactly 10s. A
        # quantile sitting precisely on its own bound is the signature.
        http.server.requests: 120s
        orgmemory.assistant: 120s
        orgmemory.graph_rag: 60s
        gen_ai.client.operation: 120s
  otlp:
    metrics:
      export:
        # Micrometer's OTLP registry is opt-out, and its URL defaults to
        # http://localhost:4318/v1/metrics — inside the container, meaning itself.
        # An application with no collector therefore exported to nowhere every
        # minute and logged the failure, which is what it did in production from
        # deployment until 2026-07-29. Tracing has the opposite default: no
        # endpoint, no exporter, no noise. Metrics now match it.
        enabled: ${ORGMEMORY_OTLP_METRICS_ENABLED:false}
  logging:
    export:
      otlp:
        # The collector tails the json-file driver, so OTLP log export would be a
        # second copy of every line. Off precautionarily: this exporter has the
        # same failure mode as the metrics one above.
        enabled: false
  opentelemetry:
    resource-attributes:
      # Without these a collector cannot tell one build or environment from
      # another. Image tags already carry the commit SHA.
      service.version: ${ORGMEMORY_SERVICE_VERSION:unknown}
      deployment.environment.name: ${ORGMEMORY_DEPLOYMENT_ENVIRONMENT:local}
  endpoints:
    web:
      exposure:
        include: health,info,modulith

logging:
  level:
    # The provider libraries concatenate the prompt and the response content into
    # WARN messages of their own, which `spring.ai.chat.observations.log-prompt`
    # does not reach because it only governs Spring AI observation handlers.
    # Every such site is guarded by isWarnEnabled(), so pinning these packages
    # above WARN stops the payload from being built at all.
    #
    # This is the safe default, not the enforcement: LOGGING_LEVEL_* environment
    # variables, system properties and logback configuration all outrank it.
    # ProviderLoggingBoundaryVerifier checks the resolved level at startup and
    # refuses to run with these open.
    # See docs/runbooks/graph-rag-production-hardening.md.
    org.springframework.ai.openai: ERROR
    org.springframework.ai.anthropic: ERROR
