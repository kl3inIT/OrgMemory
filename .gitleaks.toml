title = "OrgMemory Gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Immutable GHCR references use public Git commit SHAs"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
regexes = ['''"reference":\s*"ghcr\.io/kl3init/orgmemory-[a-z0-9-]+:sha-[0-9a-f]{40}"''']
paths = ['''^release/artifacts\.json$''']

[[allowlists]]
description = "Assistant redaction test uses a synthetic API-key-shaped prompt fragment"
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["ad5811174d054aa76ea590bdab1a201713c16cf4"]
paths = ['''^apps/api/src/test/java/com/orgmemory/api/assistant/AssistantStreamFailuresTests\.java$''']
