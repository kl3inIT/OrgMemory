# Tempo 3.0, monolithic.
#
# 3.0 replaced the ingester-based architecture: block-builders, live-stores and
# a backend scheduler take over from ingesters and the compactor. Monolithic
# deployments need no Kafka and no new components, but the `ingester`,
# `ingester_client`, `compactor` and `metrics_generator_client` blocks are gone
# and Tempo will not start with them present. This config is written for 3.0
# rather than carried over from a 2.x one.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://observability-prometheus:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      # `local-blocks` is dropped: 3.0 removed its metrics-generator
      # configuration, and service graphs plus span metrics are what the
      # dashboards actually read.
      processors: [service-graphs, span-metrics]

# Block retention is no longer a `compactor` setting: 3.0 moved it to the backend
# scheduler, as `-backend-scheduler.provider.work.compaction.block-retention`.
# The default is 336h, which matches the fourteen days Prometheus keeps, so it is
# left alone rather than restated in a second place that could drift.

usage_report:
  reporting_enabled: false
