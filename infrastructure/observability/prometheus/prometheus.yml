# Prometheus receives rather than scrapes.
#
# Application metrics arrive by OTLP push through Alloy, because apps/worker
# sets `spring.main.web-application-type: none` and serves no HTTP to scrape.
# Host and container metrics are scraped by Alloy and forwarded the same way, so
# everything enters through one door and can be relabelled or dropped in one
# place before storage.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    monitor: orgmemory

# The only thing Prometheus scrapes is itself. Anything else would be a second
# ingest path with no relabelling stage in front of it.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

storage:
  tsdb:
    # OTLP push can deliver a sample slightly behind the head block, and the
    # default of zero rejects it. Rejected samples look identical to samples that
    # were never sent.
    out_of_order_time_window: 30m
