name: orgmemory

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

x-oidc-environment: &oidc-environment
  ORGMEMORY_OIDC_ISSUER_URI: https://auth.kl3in.tech/realms/orgmemory
  ORGMEMORY_OIDC_JWK_SET_URI: http://keycloak:8080/realms/orgmemory/protocol/openid-connect/certs
  ORGMEMORY_OIDC_TOKEN_URI: http://keycloak:8080/realms/orgmemory/protocol/openid-connect/token

# Every deployable gets exactly this, and gets it from one place. `apps/mcp`
# previously inherited only the OIDC anchor, so it carried neither a collector
# endpoint nor a service version: its spans would have been labelled "local" and
# sent nowhere, which reads identically to an application with nothing to say.
x-telemetry-environment: &telemetry-environment
  # deploy.sh pins ORGMEMORY_SERVICE_VERSION to the released commit alongside the
  # image tags, so the version a collector reports cannot drift from the image
  # actually running. Without these the applications fall back to their local
  # defaults and label production as "local", which is worse than an absent
  # attribute.
  ORGMEMORY_DEPLOYMENT_ENVIRONMENT: production
  ORGMEMORY_SERVICE_VERSION: ${ORGMEMORY_SERVICE_VERSION:-unknown}
  # Spring property names, not `OTEL_*`. application-prod.yml sets
  # `management.opentelemetry.map-environment-variables: false` so this
  # deployment cannot acquire a destination nobody chose — which also means
  # OTEL_EXPORTER_OTLP_ENDPOINT is read by nothing here, and setting it would
  # leave the exporter exactly as silent as before with no error to say so.
  # Names read from the Boot 4.1 configuration metadata rather than from prose.
  #
  # `observability-alloy`, never `localhost`: Alloy binds 127.0.0.1 on the host,
  # and inside a container that address is the container itself. That mistake is
  # the original production symptom.
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: ${ORGMEMORY_OTLP_TRACES_ENDPOINT:-http://observability-alloy:4318/v1/traces}
  MANAGEMENT_OTLP_METRICS_EXPORT_URL: ${ORGMEMORY_OTLP_METRICS_URL:-http://observability-alloy:4318/v1/metrics}
  ORGMEMORY_OTLP_METRICS_ENABLED: ${ORGMEMORY_OTLP_METRICS_ENABLED:-true}

x-spring-environment: &spring-environment
  <<: [*oidc-environment, *telemetry-environment]
  SPRING_PROFILES_ACTIVE: prod
  ORGMEMORY_DB_URL: jdbc:postgresql://postgres:5432/${ORGMEMORY_DB_NAME:-orgmemory}
  ORGMEMORY_DB_USER: ${ORGMEMORY_DB_USER:-orgmemory}
  ORGMEMORY_DB_PASSWORD: ${ORGMEMORY_DB_PASSWORD:?Set ORGMEMORY_DB_PASSWORD}
  ORGMEMORY_OIDC_CLIENT_ID: orgmemory-web
  ORGMEMORY_OIDC_CLIENT_SECRET: ${ORGMEMORY_OIDC_CLIENT_SECRET:?Set ORGMEMORY_OIDC_CLIENT_SECRET}
  ORGMEMORY_WEB_BASE_URL: https://om.kl3in.tech
  ORGMEMORY_OPENFGA_API_URL: http://openfga:8080
  ORGMEMORY_OPENFGA_STORE_ID: ${ORGMEMORY_OPENFGA_STORE_ID:-}
  ORGMEMORY_OPENFGA_AUTHORIZATION_MODEL_ID: ${ORGMEMORY_OPENFGA_AUTHORIZATION_MODEL_ID:-}
  ORGMEMORY_OBJECT_STORAGE_ENDPOINT: http://minio:9000
  ORGMEMORY_OBJECT_STORAGE_ACCESS_KEY: ${ORGMEMORY_OBJECT_STORAGE_ACCESS_KEY:?Set ORGMEMORY_OBJECT_STORAGE_ACCESS_KEY}
  ORGMEMORY_OBJECT_STORAGE_SECRET_KEY: ${ORGMEMORY_OBJECT_STORAGE_SECRET_KEY:?Set ORGMEMORY_OBJECT_STORAGE_SECRET_KEY}
  ORGMEMORY_OBJECT_STORAGE_BUCKET: ${ORGMEMORY_OBJECT_STORAGE_BUCKET:-orgmemory-evidence}
  ORGMEMORY_OPENAI_BASE_URL: ${ORGMEMORY_OPENAI_BASE_URL:-https://api.openai.com/v1}
  ORGMEMORY_OPENAI_API_KEY: ${ORGMEMORY_OPENAI_API_KEY:?Set ORGMEMORY_OPENAI_API_KEY}
  ORGMEMORY_OPENAI_MODEL: ${ORGMEMORY_OPENAI_MODEL:-gpt-5.6-sol}
  ORGMEMORY_KEYWORD_MODEL: ${ORGMEMORY_KEYWORD_MODEL:-gpt-5.6-luna}
  ORGMEMORY_OPENAI_REASONING_EFFORT_SUPPORTED: ${ORGMEMORY_OPENAI_REASONING_EFFORT_SUPPORTED:-true}
  ORGMEMORY_KEYWORD_OPENAI_REASONING_EFFORT: ${ORGMEMORY_KEYWORD_OPENAI_REASONING_EFFORT:-none}
  ORGMEMORY_GRAPH_QUERY_KEYWORD_CACHE_TTL: ${ORGMEMORY_GRAPH_QUERY_KEYWORD_CACHE_TTL:-24h}
  ORGMEMORY_GRAPH_QUERY_MAXIMUM_CONCURRENT_SPACES: ${ORGMEMORY_GRAPH_QUERY_MAXIMUM_CONCURRENT_SPACES:-4}
  ORGMEMORY_GRAPH_EXTRACTION_MODEL: ${ORGMEMORY_GRAPH_EXTRACTION_MODEL:-gpt-5.4-mini}
  ORGMEMORY_GRAPH_EXTRACTION_OPENAI_REASONING_EFFORT: ${ORGMEMORY_GRAPH_EXTRACTION_OPENAI_REASONING_EFFORT:-}
  ORGMEMORY_OPENAI_EMBEDDING_MODEL: ${ORGMEMORY_OPENAI_EMBEDDING_MODEL:-text-embedding-3-large}
  ORGMEMORY_OPENAI_EMBEDDING_DIMENSIONS: ${ORGMEMORY_OPENAI_EMBEDDING_DIMENSIONS:-1536}
  ORGMEMORY_SECRETS_KEY: ${ORGMEMORY_SECRETS_KEY:?Set ORGMEMORY_SECRETS_KEY}
  ORGMEMORY_SECRETS_SALT: ${ORGMEMORY_SECRETS_SALT:?Set ORGMEMORY_SECRETS_SALT}
  ORGMEMORY_SECRETS_KEY_VERSION: ${ORGMEMORY_SECRETS_KEY_VERSION:-1}
  ORGMEMORY_ROOT_LOG_LEVEL: ${ORGMEMORY_ROOT_LOG_LEVEL:-INFO}
  ORGMEMORY_APP_LOG_LEVEL: ${ORGMEMORY_APP_LOG_LEVEL:-DEBUG}
  ORGMEMORY_SECURITY_LOG_LEVEL: ${ORGMEMORY_SECURITY_LOG_LEVEL:-INFO}
  ORGMEMORY_SQL_LOG_LEVEL: ${ORGMEMORY_SQL_LOG_LEVEL:-INFO}
  ORGMEMORY_HEALTH_SHOW_DETAILS: ${ORGMEMORY_HEALTH_SHOW_DETAILS:-always}

services:
  postgres-bootstrap:
    image: ${ORGMEMORY_POSTGRES_IMAGE:?Set ORGMEMORY_POSTGRES_IMAGE}
    restart: "no"
    entrypoint:
      - /usr/local/bin/bootstrap-shared-databases
    environment:
      PGHOST: postgres
      PGUSER: ${SHARED_POSTGRES_ADMIN_USER:?Set SHARED_POSTGRES_ADMIN_USER}
      PGPASSWORD: ${SHARED_POSTGRES_ADMIN_PASSWORD:?Set SHARED_POSTGRES_ADMIN_PASSWORD}
      ORGMEMORY_DB_NAME: ${ORGMEMORY_DB_NAME:-orgmemory}
      ORGMEMORY_DB_USER: ${ORGMEMORY_DB_USER:-orgmemory}
      ORGMEMORY_DB_PASSWORD: ${ORGMEMORY_DB_PASSWORD:?Set ORGMEMORY_DB_PASSWORD}
      OPENFGA_DB_NAME: ${OPENFGA_DB_NAME:-openfga}
      OPENFGA_DB_USER: ${OPENFGA_DB_USER:-openfga}
      OPENFGA_DB_PASSWORD: ${OPENFGA_DB_PASSWORD:?Set OPENFGA_DB_PASSWORD}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}
    networks:
      - shared-infra
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  openfga-migrate:
    image: openfga/openfga:v1.18.1@sha256:efde89d24487da1a8bc37d85b61341f1fb7024943a1ded65f4b7d51a75666688
    command:
      - migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: ${OPENFGA_DATASTORE_URI:?Set OPENFGA_DATASTORE_URI}
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
    networks:
      - orgmemory-internal
      - shared-infra
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  openfga:
    <<: *service-defaults
    image: openfga/openfga:v1.18.1@sha256:efde89d24487da1a8bc37d85b61341f1fb7024943a1ded65f4b7d51a75666688
    command:
      - run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: ${OPENFGA_DATASTORE_URI:?Set OPENFGA_DATASTORE_URI}
      OPENFGA_LOG_FORMAT: json
      OPENFGA_LOG_LEVEL: ${OPENFGA_LOG_LEVEL:-info}
      OPENFGA_PLAYGROUND_ENABLED: "false"
      OPENFGA_METRICS_ENABLED: "true"
      OPENFGA_DATASTORE_MAX_OPEN_CONNS: ${OPENFGA_DATASTORE_MAX_OPEN_CONNS:-12}
      OPENFGA_DATASTORE_MIN_OPEN_CONNS: ${OPENFGA_DATASTORE_MIN_OPEN_CONNS:-2}
      OPENFGA_DATASTORE_MAX_IDLE_CONNS: ${OPENFGA_DATASTORE_MAX_IDLE_CONNS:-8}
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    networks:
      - orgmemory-internal
      - shared-infra
    read_only: true
    deploy:
      resources:
        limits:
          cpus: "0.50"
        reservations:
          memory: 96m

  openfga-ready:
    image: curlimages/curl:8.17.0@sha256:935d9100e9ba842cdb060de42472c7ca90cfe9a7c96e4dacb55e79e560b3ff40
    command:
      - --fail
      - --silent
      - --show-error
      - --retry
      - "30"
      - --retry-all-errors
      - --retry-delay
      - "2"
      - http://openfga:8080/healthz
    depends_on:
      openfga:
        condition: service_started
    networks:
      - orgmemory-internal
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  openfga-bootstrap:
    image: openfga/cli:v0.7.19@sha256:2e0e250043ef480a9162623dbf1ff7a62a1a2cb96a79cb20577b144994ab114d
    profiles:
      - ops
    command:
      - store
      - create
      - --name
      - OrgMemory Production
      - --model
      - /model/model.fga
      - --api-url
      - http://openfga:8080
    depends_on:
      openfga-ready:
        condition: service_completed_successfully
    networks:
      - orgmemory-internal
    volumes:
      - ../../integrations/authorization-openfga/src/main/openfga/model.fga:/model/model.fga:ro
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  openfga-model-write:
    image: openfga/cli:v0.7.19@sha256:2e0e250043ef480a9162623dbf1ff7a62a1a2cb96a79cb20577b144994ab114d
    profiles:
      - ops
    command:
      - model
      - write
      - --store-id
      - ${ORGMEMORY_OPENFGA_STORE_ID:-}
      - --file
      - /model/model.fga
      - --format
      - fga
      - --api-url
      - http://openfga:8080
    depends_on:
      openfga-ready:
        condition: service_completed_successfully
    networks:
      - orgmemory-internal
    volumes:
      - ../../integrations/authorization-openfga/src/main/openfga/model.fga:/model/model.fga:ro
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  postgres-backup:
    image: ${ORGMEMORY_POSTGRES_IMAGE:?Set ORGMEMORY_POSTGRES_IMAGE}
    profiles:
      - ops
    user: "${ORGMEMORY_BACKUP_UID:-1000}:${ORGMEMORY_BACKUP_GID:-1000}"
    entrypoint:
      - /usr/local/bin/backup-shared-postgres
    environment:
      PGHOST: postgres
      PGUSER: ${SHARED_POSTGRES_ADMIN_USER:?Set SHARED_POSTGRES_ADMIN_USER}
      PGPASSWORD: ${SHARED_POSTGRES_ADMIN_PASSWORD:?Set SHARED_POSTGRES_ADMIN_PASSWORD}
      BACKUP_DATABASES: ${ORGMEMORY_BACKUP_DATABASES:-orgmemory openfga keycloak}
    networks:
      - shared-infra
    volumes:
      - ${ORGMEMORY_BACKUP_DIRECTORY:-/apps/orgmemory-runtime/backups}:/backup
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  minio:
    <<: *service-defaults
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1@sha256:13582eff79c6605a2d315bdd0e70164142ea7e98fc8411e9e10d089502a6d883
    command:
      - server
      - /data
    environment:
      MINIO_ROOT_USER: ${ORGMEMORY_OBJECT_STORAGE_ACCESS_KEY:?Set ORGMEMORY_OBJECT_STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${ORGMEMORY_OBJECT_STORAGE_SECRET_KEY:?Set ORGMEMORY_OBJECT_STORAGE_SECRET_KEY}
    networks:
      - orgmemory-internal
    volumes:
      - orgmemory_minio:/data
    healthcheck:
      test:
        - CMD
        - mc
        - ready
        - local
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.00"
        reservations:
          memory: 256m

  keycloak:
    <<: *service-defaults
    image: ${ORGMEMORY_KEYCLOAK_IMAGE:?Set ORGMEMORY_KEYCLOAK_IMAGE}
    environment:
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}
      KC_DB_POOL_INITIAL_SIZE: "2"
      KC_DB_POOL_MIN_SIZE: "2"
      KC_DB_POOL_MAX_SIZE: "10"
      KC_HOSTNAME: https://auth.kl3in.tech
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_MANAGEMENT_SCHEME: http
      KC_PROXY_HEADERS: xforwarded
      KC_LOG_LEVEL: ${KEYCLOAK_LOG_LEVEL:-INFO}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:?Set KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?Set KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD}
      ORGMEMORY_OIDC_CLIENT_SECRET: ${ORGMEMORY_OIDC_CLIENT_SECRET:?Set ORGMEMORY_OIDC_CLIENT_SECRET}
      ORGMEMORY_MCP_OIDC_CLIENT_SECRET: ${ORGMEMORY_MCP_OIDC_CLIENT_SECRET:?Set ORGMEMORY_MCP_OIDC_CLIENT_SECRET}
      ORGMEMORY_MCP_RESOURCE_URI: ${ORGMEMORY_MCP_RESOURCE_URI:?Set ORGMEMORY_MCP_RESOURCE_URI}
      JAVA_OPTS_KC_HEAP: -XX:InitialRAMPercentage=20 -XX:MaxRAMPercentage=65
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
    networks:
      orgmemory-internal:
      shared-infra:
      proxy:
        aliases:
          - orgmemory-keycloak
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          { printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&0;
          grep -q '"status" *: *"UP"'; } 0<>/dev/tcp/127.0.0.1/9000
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /opt/keycloak/data/tmp:size=128m,uid=1000,gid=0,mode=1770
    stop_grace_period: 45s
    deploy:
      resources:
        limits:
          cpus: "1.00"
        reservations:
          memory: 384m

  age-reconcile:
    image: ${ORGMEMORY_API_IMAGE:?Set ORGMEMORY_API_IMAGE}
    profiles:
      - ops
    environment:
      <<: *spring-environment
      ORGMEMORY_API_DB_POOL_MAXIMUM_SIZE: ${ORGMEMORY_API_DB_POOL_MAXIMUM_SIZE:-12}
      ORGMEMORY_API_DB_POOL_MINIMUM_IDLE: ${ORGMEMORY_API_DB_POOL_MINIMUM_IDLE:-2}
      ORGMEMORY_SCIM_VERIFIER_KEY: ${ORGMEMORY_SCIM_VERIFIER_KEY:?Set ORGMEMORY_SCIM_VERIFIER_KEY}
      ORGMEMORY_SCIM_VERIFIER_KEY_VERSION: ${ORGMEMORY_SCIM_VERIFIER_KEY_VERSION:?Set ORGMEMORY_SCIM_VERIFIER_KEY_VERSION}
      ORGMEMORY_SCIM_PREVIOUS_VERIFIER_KEYS: ${ORGMEMORY_SCIM_PREVIOUS_VERIFIER_KEYS:-}
      ORGMEMORY_SCIM_MAXIMUM_REQUEST_SIZE: ${ORGMEMORY_SCIM_MAXIMUM_REQUEST_SIZE:-256KB}
      ORGMEMORY_SCIM_REQUESTS_PER_MINUTE: ${ORGMEMORY_SCIM_REQUESTS_PER_MINUTE:-120}
      ORGMEMORY_SCIM_TOKEN_TTL: ${ORGMEMORY_SCIM_TOKEN_TTL:-90d}
      ORGMEMORY_SCIM_ROTATION_OVERLAP: ${ORGMEMORY_SCIM_ROTATION_OVERLAP:-15m}
      ORGMEMORY_GRAPH_RAG_POSTGRES_RECONCILE_PUBLISHED_BATCHES: "true"
      ORGMEMORY_GRAPH_RAG_POSTGRES_RECONCILIATION_PAGE_SIZE: ${ORGMEMORY_AGE_RECONCILIATION_PAGE_SIZE:-100}
      ORGMEMORY_GRAPH_RAG_POSTGRES_RECONCILIATION_MAXIMUM_BATCHES: ${ORGMEMORY_AGE_RECONCILIATION_MAXIMUM_BATCHES:-1000}
      ORGMEMORY_GRAPH_RAG_POSTGRES_RECONCILIATION_MAXIMUM_ENTITIES: ${ORGMEMORY_AGE_RECONCILIATION_MAXIMUM_ENTITIES:-1000000}
      ORGMEMORY_GRAPH_RAG_POSTGRES_RECONCILIATION_MAXIMUM_RELATION_CONTRIBUTIONS: ${ORGMEMORY_AGE_RECONCILIATION_MAXIMUM_RELATION_CONTRIBUTIONS:-1000000}
      ORGMEMORY_GRAPH_RAG_POSTGRES_PROVISION_INDEXES: "false"
    networks:
      - orgmemory-internal
      - shared-infra
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  api:
    <<: *service-defaults
    image: ${ORGMEMORY_API_IMAGE:?Set ORGMEMORY_API_IMAGE}
    environment:
      <<: *spring-environment
      ORGMEMORY_API_DB_POOL_MAXIMUM_SIZE: ${ORGMEMORY_API_DB_POOL_MAXIMUM_SIZE:-12}
      ORGMEMORY_API_DB_POOL_MINIMUM_IDLE: ${ORGMEMORY_API_DB_POOL_MINIMUM_IDLE:-2}
      ORGMEMORY_SCIM_VERIFIER_KEY: ${ORGMEMORY_SCIM_VERIFIER_KEY:?Set ORGMEMORY_SCIM_VERIFIER_KEY}
      ORGMEMORY_SCIM_VERIFIER_KEY_VERSION: ${ORGMEMORY_SCIM_VERIFIER_KEY_VERSION:?Set ORGMEMORY_SCIM_VERIFIER_KEY_VERSION}
      ORGMEMORY_SCIM_PREVIOUS_VERIFIER_KEYS: ${ORGMEMORY_SCIM_PREVIOUS_VERIFIER_KEYS:-}
      ORGMEMORY_SCIM_MAXIMUM_REQUEST_SIZE: ${ORGMEMORY_SCIM_MAXIMUM_REQUEST_SIZE:-256KB}
      ORGMEMORY_SCIM_REQUESTS_PER_MINUTE: ${ORGMEMORY_SCIM_REQUESTS_PER_MINUTE:-120}
      ORGMEMORY_SCIM_TOKEN_TTL: ${ORGMEMORY_SCIM_TOKEN_TTL:-90d}
      ORGMEMORY_SCIM_ROTATION_OVERLAP: ${ORGMEMORY_SCIM_ROTATION_OVERLAP:-15m}
    depends_on:
      keycloak:
        condition: service_healthy
      minio:
        condition: service_healthy
      openfga-ready:
        condition: service_completed_successfully
    networks:
      - orgmemory-internal
      - shared-infra
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O - http://127.0.0.1:8080/actuator/health/readiness
          | grep -q '"status":"UP"'
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    stop_grace_period: 45s
    cpu_shares: 1024
    deploy:
      resources:
        limits:
          cpus: "2.00"
        reservations:
          memory: 512m

  worker:
    <<: *service-defaults
    image: ${ORGMEMORY_WORKER_IMAGE:?Set ORGMEMORY_WORKER_IMAGE}
    environment:
      <<: *spring-environment
      ORGMEMORY_WORKER_DB_POOL_MAXIMUM_SIZE: ${ORGMEMORY_WORKER_DB_POOL_MAXIMUM_SIZE:-8}
      ORGMEMORY_WORKER_DB_POOL_MINIMUM_IDLE: ${ORGMEMORY_WORKER_DB_POOL_MINIMUM_IDLE:-1}
      ORGMEMORY_GRAPH_EXTRACTION_CONCURRENCY: ${ORGMEMORY_GRAPH_EXTRACTION_CONCURRENCY:-2}
      ORGMEMORY_GRAPH_EXTRACTION_TIMEOUT: ${ORGMEMORY_GRAPH_EXTRACTION_TIMEOUT:-5m}
      ORGMEMORY_CONNECTOR_SCHEDULING_ENABLED: ${ORGMEMORY_CONNECTOR_SCHEDULING_ENABLED:-true}
      ORGMEMORY_CONNECTOR_POLL_INTERVAL: ${ORGMEMORY_CONNECTOR_POLL_INTERVAL:-30s}
      JAVA_TOOL_OPTIONS: >-
        -XX:InitialRAMPercentage=15
        -XX:MaxRAMPercentage=60
        -XX:+ExitOnOutOfMemoryError
        -Dfile.encoding=UTF-8
    depends_on:
      api:
        condition: service_healthy
    networks:
      - orgmemory-internal
      - shared-infra
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    stop_grace_period: 45s
    cpu_shares: 512
    deploy:
      resources:
        limits:
          cpus: "1.50"
        reservations:
          memory: 768m

  mcp:
    <<: *service-defaults
    image: ${ORGMEMORY_MCP_IMAGE:?Set ORGMEMORY_MCP_IMAGE}
    environment:
      <<: [*oidc-environment, *telemetry-environment]
      SPRING_PROFILES_ACTIVE: prod
      ORGMEMORY_API_BASE_URL: http://api:8080
      ORGMEMORY_MCP_CONNECT_TIMEOUT: ${ORGMEMORY_MCP_CONNECT_TIMEOUT:-5s}
      ORGMEMORY_MCP_REQUEST_TIMEOUT: ${ORGMEMORY_MCP_REQUEST_TIMEOUT:-75s}
      ORGMEMORY_MCP_RESOURCE_URI: ${ORGMEMORY_MCP_RESOURCE_URI:?Set ORGMEMORY_MCP_RESOURCE_URI}
      ORGMEMORY_MCP_AUDIENCE: ${ORGMEMORY_MCP_AUDIENCE:?Set ORGMEMORY_MCP_AUDIENCE}
      ORGMEMORY_MCP_API_AUDIENCE: ${ORGMEMORY_MCP_API_AUDIENCE:-orgmemory-web}
      ORGMEMORY_MCP_OIDC_CLIENT_ID: ${ORGMEMORY_MCP_OIDC_CLIENT_ID:-orgmemory-mcp}
      ORGMEMORY_MCP_OIDC_CLIENT_SECRET: ${ORGMEMORY_MCP_OIDC_CLIENT_SECRET:?Set ORGMEMORY_MCP_OIDC_CLIENT_SECRET}
      ORGMEMORY_MCP_RATE_LIMIT_ENABLED: ${ORGMEMORY_MCP_RATE_LIMIT_ENABLED:-true}
      ORGMEMORY_MCP_GLOBAL_RATE_CAPACITY: ${ORGMEMORY_MCP_GLOBAL_RATE_CAPACITY:-800}
      ORGMEMORY_MCP_GLOBAL_RATE_WINDOW: ${ORGMEMORY_MCP_GLOBAL_RATE_WINDOW:-1m}
      ORGMEMORY_MCP_CALLER_RATE_CAPACITY: ${ORGMEMORY_MCP_CALLER_RATE_CAPACITY:-120}
      ORGMEMORY_MCP_CALLER_RATE_WINDOW: ${ORGMEMORY_MCP_CALLER_RATE_WINDOW:-1m}
      ORGMEMORY_MCP_CALLER_RATE_EXPIRY: ${ORGMEMORY_MCP_CALLER_RATE_EXPIRY:-15m}
      ORGMEMORY_MCP_MAX_TRACKED_CALLERS: ${ORGMEMORY_MCP_MAX_TRACKED_CALLERS:-10000}
      ORGMEMORY_MCP_MAX_BODY_BYTES: ${ORGMEMORY_MCP_MAX_BODY_BYTES:-262144}
      ORGMEMORY_SKILL_PUBLICATION_MAX_BODY_BYTES: ${ORGMEMORY_SKILL_PUBLICATION_MAX_BODY_BYTES:-23068672}
      ORGMEMORY_ROOT_LOG_LEVEL: ${ORGMEMORY_ROOT_LOG_LEVEL:-INFO}
      ORGMEMORY_APP_LOG_LEVEL: ${ORGMEMORY_APP_LOG_LEVEL:-DEBUG}
      ORGMEMORY_SECURITY_LOG_LEVEL: ${ORGMEMORY_SECURITY_LOG_LEVEL:-INFO}
      ORGMEMORY_HEALTH_SHOW_DETAILS: ${ORGMEMORY_HEALTH_SHOW_DETAILS:-always}
    depends_on:
      api:
        condition: service_healthy
    networks:
      orgmemory-internal:
      # Joins the shared network for one reason: to reach the collector. It is
      # the only deployable that did not, so its spans had nowhere to go while
      # the other two were merely unconfigured.
      shared-infra:
      proxy:
        aliases:
          - orgmemory-mcp
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O - http://127.0.0.1:8090/actuator/health/readiness
          | grep -q '"status":"UP"'
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    deploy:
      resources:
        limits:
          cpus: "0.50"
        reservations:
          memory: 128m

  web:
    <<: *service-defaults
    image: ${ORGMEMORY_WEB_IMAGE:?Set ORGMEMORY_WEB_IMAGE}
    depends_on:
      api:
        condition: service_healthy
    networks:
      orgmemory-internal:
      proxy:
        aliases:
          - orgmemory-web
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/cache/nginx:size=32m,uid=101,gid=101,mode=0750
      - /var/run:size=8m,uid=101,gid=101,mode=0750
    deploy:
      resources:
        limits:
          cpus: "0.50"
        reservations:
          memory: 48m

networks:
  orgmemory-internal:
    name: orgmemory-internal
    internal: true
  shared-infra:
    name: ${ORGMEMORY_SHARED_INFRA_NETWORK:-shared-infra}
    external: true
  proxy:
    name: ${ORGMEMORY_PROXY_NETWORK:-proxy-network}
    external: true

volumes:
  orgmemory_minio:
    name: orgmemory_minio
